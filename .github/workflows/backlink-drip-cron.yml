name: 🔗 Backlink Drip Runner (Every 15 Min)

on:
  schedule:
    # Runs every 15 minutes — safe natural drip-feed for Google SEO
    - cron: "*/15 * * * *"

  # Manual trigger allowed from GitHub Actions UI
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "Manual backlink queue run"

jobs:
  process-backlink:
    name: Process 1 Queued Backlink
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Call Backlink Queue API
        id: trigger
        run: |
          echo "⏰ Processing backlink queue at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            -X GET \
            "https://www.rojgarsuvidha.com/api/cron/process-backlink-queue?key=${{ secrets.CRON_SECRET || 'rojgarsuvidha_auto_blog_2026' }}")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.txt)"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Backlink processed successfully!"
          else
            echo "❌ Backlink queue run failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: 📊 Summary Log
        if: always()
        run: |
          echo "Run finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
