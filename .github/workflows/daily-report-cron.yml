name: 📊 Daily 9 PM Executive Report

on:
  schedule:
    # 15:30 UTC = 21:00 (9:00 PM) IST every single day
    - cron: "30 15 * * *"

  # Manual trigger allowed from GitHub Actions UI anytime
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "Manual daily report trigger"

jobs:
  send-daily-report:
    name: Generate and Send 9 PM Executive Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Trigger Daily 9 PM Report API
        id: trigger
        run: |
          echo "⏰ Triggering Daily Executive Report at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            -X GET \
            "https://www.rojgarsuvidha.com/api/cron/daily-report?key=admin9pm")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.txt)"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Daily Executive Report sent to Telegram successfully!"
          else
            echo "❌ Daily report failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: 📊 Summary Log
        if: always()
        run: |
          echo "Daily report job completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
